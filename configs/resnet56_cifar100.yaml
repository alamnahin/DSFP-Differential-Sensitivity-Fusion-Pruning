# configs/resnet56_cifar100.yaml
# DSFP experiment: ResNet-56 on CIFAR-100.
# Run: python main.py --config configs/resnet56_cifar100.yaml

arch: resnet56
dataset: cifar100
num-classes: 100
data-dir: ./data

batch-size: 128
num-workers: 2
calibration-size: 512

base-epochs: 40
base-lr: 0.001
weight-decay: 0.0001
momentum: 0.9
label-smoothing: 0.1
cosine-t0: 50
cosine-tmult: 2
accumulation-steps: 4
patience: 12

pruning-rates: [50, 70]
method: dsfp

bandit-lr: 0.01
bandit-buffer-size: 512
bandit-hidden: 32
bandit-epsilon-decay: 0.995
bandit-explore-delta: 5.0

kd-epochs: 700
kd-lr: 0.0001
kd-weight-decay: 0.0001
kd-alpha: 0.5
kd-temperature: 4.0
kd-patience: 10
kd-dynamic-alpha: true

seeds: [42, 123, 2026]

output-dir: ./results
save-checkpoints: true
amp: true
ablation: false
baselines: true
